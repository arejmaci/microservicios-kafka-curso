spring.application.name=product-command
server.port=8081

# Funcion que quiero configurar como binder
spring.cloud.function.definition=handlerCommands

#Configuracion de la cola de mensajes, el topico que tiene que escuchar
spring.cloud.stream.bindings.handlerCommands-in-0.destination=product-commands
spring.cloud.stream.bindings.handlerCommands-in-0.content-type=application/json

spring.cloud.stream.kafka.binder.brokers=localhost:9092
