spring.application.name=products-api
server.port=8080

#Bindea el canal de comunicacion y el topico. El canal de comunicacion, nombre logico (productCommand-out-0) con el nombre del topic (product-commands) de kafka.
spring.cloud.stream.bindings.productCommand-out-0.destination=product-commands

#Asegura que el objeto Java que envíes se convierta automáticamente a JSON. Tipo de contenido que se enviara al topic (product-commands) de kafka.
spring.cloud.stream.bindings.productCommand-out-0.content-type=application/json

#Configuracion de kafka (Le indica dónde está escuchando tu servidor de Kafka localmente)
spring.cloud.stream.kafka.binder.brokers=localhost:9092